<section class="page-shell weekly-shell">
  <div class="date-picker-container surface-card surface-card--muted">
    <div class="page-header date-picker-header">
      <div>
        <h2>Weekly view</h2>
        <p class="page-subtitle">Select any date to review the surrounding station week.</p>
      </div>
    </div>

    <div class="date-picker-navigation">
      <button (click)="previousWeek()" class="nav-button prev-button" type="button" aria-label="Previous week">
        <span class="arrow">&lt;</span>
      </button>
      <form #dateForm="ngForm">
        <input type="date"
               id="simple-date"
               class="date-input"
               [(ngModel)]="date"
               (ngModelChange)="onDateChange()"
               name="date">
      </form>
      <button (click)="nextWeek()" class="nav-button next-button" type="button" aria-label="Next week">
        <span class="arrow">&gt;</span>
      </button>
      <button (click)="today()" class="today-button" type="button">Today</button>
    </div>
  </div>

  <app-weekly-stats [date]=date/>
</section>
